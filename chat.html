<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пётр — Помощник Дмитрия</title>
    <!-- Официальный скрипт SDK мини-приложений платформы МАКС -->
    <script src="https://platform.max.ru/js/web-app.js"></script>
    <style>
        :root { --primary: #ff9900; --primary-dark: #e08500; --dark: #0b0b0b; --card-bg: #1a1a1a; --border-color: #2a2a2a; --text-gray: #a0a0a0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .chat-header { background: var(--card-bg); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); }
        .chat-header-info h2 { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .chat-header-info h2 span { color: var(--primary); }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.1); }

        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 14px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .message.bot { background: var(--card-bg); align-self: flex-start; border: 1px solid var(--border-color); color: #fff; }
        .message.user { background: var(--primary); color: #000; align-self: flex-end; font-weight: 500; }

        .chat-input-area { padding: 15px 20px; background: var(--card-bg); border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        input { flex: 1; background: var(--dark); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 10px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); }
        
        button.send-btn { background: var(--primary); color: #000; border: none; padding: 0 20px; height: 46px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        button.send-btn:hover { background: var(--primary-dark); }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="chat-header-info">
            <h2>Пётр — помощник <span>Дмитрия</span></h2>
        </div>
        <a href="index.html" class="back-btn">На главную</a>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot" id="welcomeMsg">Здравствуйте! Я Пётр, помощник Дмитрия. Какой у вас объект?</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        // Инициализация WebApp платформы МАКС при загрузке
        if (window.Max && window.Max.WebApp) {
            window.Max.WebApp.ready();
        }

        // Подхватываем услугу из ссылки, если клиент пришел с карточки услуги
        const urlParams = new URLSearchParams(window.location.search);
        const contextService = urlParams.get('context');
        if (contextService) {
            document.getElementById('welcomeMsg').innerText = `Интересует направление: "${contextService}". Расскажите подробнее про ваш объект (площадь, назначение)?`;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            const messagesContainer = document.getElementById('chatMessages');
            
            // Отображаем сообщение пользователя в интерфейсе чата
            messagesContainer.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                // Прямой запрос на локальный Flask-сервер Петра (/api/chat)
                const response = await fetch('http://127.0.0.1:5000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: text, 
                        context: contextService || "Общая консультация" 
                    })
                });

                const data = await response.json();
                const reply = data.reply || "Уточните параметры объекта.";

                // Выводим ответ Петра в интерфейс
                messagesContainer.innerHTML += `<div class="message bot">${reply}</div>`;
            } catch (e) {
                console.error("Ошибка связи с ядром:", e);
                messagesContainer.innerHTML += `<div class="message bot">Сервер временно недоступен. Проверьте запуск скрипта на ПК.</div>`;
            }
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Дополнительная отправка в МАКС, если открыто внутри платформы
            try {
                if (window.Max && window.Max.WebApp && typeof window.Max.WebApp.sendData === 'function') {
                    window.Max.WebApp.sendData(JSON.stringify({ text: text, context: contextService || "Общая консультация" }));
                }
            } catch (err) {
                console.error("Ошибка отправки в МАКС:", err);
            }
        }
    </script>
</body>
</html>
