<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пётр — Помощник инженера Дмитрия</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
        .chat-header { background: #2c3e50; color: #fff; padding: 15px; border-top-left-radius: 8px; border-top-right-radius: 8px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 6px; max-width: 80%; line-height: 1.4; }
        .message.user { background: #3498db; color: #fff; align-self: flex-end; }
        .message.assistant { background: #e2e8f0; color: #2d3748; align-self: flex-start; }
        .chat-input { display: border-box; padding: 15px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .chat-input button { background: #2c3e50; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .chat-input button:hover { background: #34495e; }
        .back-btn { background: transparent; color: #fff; border: 1px solid #fff; padding: 5px 10px; border-radius: 4px; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span id="chat-title">Пётр — помощник инженера Дмитрия</span>
        <a href="index.html" class="back-btn">На главную</a>
    </div>
    <div class="chat-messages" id="chat-messages">
        <div class="message assistant">Здравствуйте! Я Пётр, помощник инженера Дмитрия. Какой у вас объект или по какому разделу нужна консультация?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="user-input" placeholder="Введите сообщение..." onkeypress="if(event.key === 'Enter') sendMessage();">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const contextService = urlParams.get('context') || 'Общая консультация';
    document.getElementById('chat-title').innerText = 'Пётр: ' + contextService;

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        if (!text) return;

        const messagesContainer = document.getElementById('chat-messages');
        
        // Добавляем сообщение пользователя
        messagesContainer.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
        inputField.value = '';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, context: contextService })
            });
            const data = await response.json();
            
            // Добавляем ответ Петра
            messagesContainer.innerHTML += `<div class="message assistant">${escapeHtml(data.reply || 'Ошибка ответа')}</div>`;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } catch (err) {
            messagesContainer.innerHTML += `<div class="message assistant">Ошибка связи с сервером.</div>`;
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
