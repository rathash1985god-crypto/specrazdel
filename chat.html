<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пётр — Помощник Дмитрия</title>
    <style>
        :root { --primary: #ff9900; --primary-dark: #e08500; --dark: #0b0b0b; --card-bg: #1a1a1a; --border-color: #2a2a2a; --text-gray: #a0a0a0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--dark); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .chat-header { background: var(--card-bg); padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px scale(1) solid var(--border-color); flex-shrink: 0; }
        .chat-header-info h2 { font-size: 1.05rem; font-weight: 700; color: #fff; }
        .chat-header-info h2 span { color: var(--primary); }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
        .back-btn:hover { background: rgba(255,255,255,0.1); }

        .chat-container { flex: 1; display: flex; flex-direction: column; background: var(--dark); position: relative; overflow: hidden; }
        
        /* Контейнер для официального Telegram виджета */
        #telegram-chat-container {
            flex: 1;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }
    </style>
</head>
<body>

    <div class="chat-header">
        <div class="chat-header-info">
            <h2>Пётр — помощник <span>Дмитрия</span></h2>
        </div>
        <a href="index.html" class="back-btn">На главную</a>
    </div>

    <div class="chat-container">
        <!-- Официальный виджет Telegram-чата встраивается прямо сюда -->
        <div id="telegram-chat-container">
            <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-discussion="specrazdel_pd_bot" 
                data-chats-list="true"
                data-userpic="true"
                data-dark="1"
                data-colorful="1"
                data-width="100%"
                data-height="100%">
            </script>
        </div>
    </div>

    <script>
        // Подхватываем услугу из ссылки, если клиент пришел с карточки услуги на сайте
        const urlParams = new URLSearchParams(window.location.search);
        const contextService = urlParams.get('context');
        if (contextService) {
            console.log("Выбранное направление услуги:", contextService);
        }
    </script>
</body>
</html>
